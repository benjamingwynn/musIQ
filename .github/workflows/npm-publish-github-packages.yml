name: Package

on:
  push:
    branches: [main]   # change to your branch

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
      - run: npm ci

      - name: Stamp version with timestamp
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          STAMP=$(date -u +%Y%m%d%H%M%S)
          npm pkg set version="${BASE}-${STAMP}"
          echo "Publishing $(node -p "require('./package.json').version")"

      - run: npm publish --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
